<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="dashboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  
  <!-- "Before" chaos side (left) - scattered credentials -->
  <g opacity="0.4" transform="translate(50, 80)">
    <!-- Scattered code files -->
    <rect x="0" y="0" width="50" height="35" rx="3" fill="#ef4444" opacity="0.6" transform="rotate(-15)"/>
    <text x="25" y="20" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle" transform="rotate(-15)">repo1</text>
    
    <rect x="60" y="40" width="50" height="35" rx="3" fill="#ef4444" opacity="0.6" transform="rotate(10)"/>
    <text x="85" y="62" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle" transform="rotate(10)">repo2</text>
    
    <rect x="20" y="90" width="50" height="35" rx="3" fill="#ef4444" opacity="0.6" transform="rotate(-8)"/>
    <text x="45" y="112" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle" transform="rotate(-8)">repo3</text>
    
    <rect x="70" y="130" width="50" height="35" rx="3" fill="#ef4444" opacity="0.6" transform="rotate(5)"/>
    <text x="95" y="152" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle" transform="rotate(5)">repo4</text>
    
    <!-- X marks for problems -->
    <g stroke="#ef4444" stroke-width="2" opacity="0.8">
      <path d="M5 55 L15 65 M15 55 L5 65"/>
      <path d="M115 25 L125 35 M125 25 L115 35"/>
      <path d="M85 100 L95 110 M95 100 L85 110"/>
    </g>
    
    <!-- Slack/spreadsheet icons -->
    <rect x="0" y="180" width="45" height="30" rx="3" fill="#475569" opacity="0.5"/>
    <text x="22" y="200" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">slack</text>
    
    <rect x="55" y="190" width="45" height="30" rx="3" fill="#475569" opacity="0.5"/>
    <text x="77" y="210" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">sheets</text>
  </g>
  
  <!-- Arrow from chaos to order -->
  <g transform="translate(170, 200)">
    <path d="M0 0 L60 0" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8,4" opacity="0.6"/>
    <polygon points="60,0 50,-8 50,8" fill="#0ea5e9"/>
  </g>
  
  <!-- Central Dashboard (Credenza) -->
  <g transform="translate(250, 50)" filter="url(#shadow)">
    <!-- Main dashboard frame -->
    <rect x="0" y="0" width="300" height="280" rx="12" fill="url(#dashboardGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Dashboard header -->
    <rect x="0" y="0" width="300" height="40" rx="12" fill="url(#accentGrad)"/>
    <rect x="0" y="28" width="300" height="12" fill="url(#accentGrad)"/>
    
    <!-- Credenza logo/title -->
    <text x="150" y="26" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔑 CREDENZA</text>
    
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="rgba(255,255,255,0.3)"/>
    <circle cx="38" cy="20" r="5" fill="rgba(255,255,255,0.3)"/>
    <circle cx="56" cy="20" r="5" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Account cards grid -->
    <g transform="translate(15, 55)">
      <!-- Row 1 -->
      <g>
        <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="8" fill="#22c55e"/>
        <text x="18" y="20" fill="#0f172a" font-family="system-ui" font-size="8" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="16" fill="#e2e8f0" font-family="monospace" font-size="8">user_01</text>
        <text x="42" y="35" fill="#22c55e" font-family="monospace" font-size="7" text-anchor="middle">ACTIVE</text>
      </g>
      
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="8" fill="#22c55e"/>
        <text x="18" y="20" fill="#0f172a" font-family="system-ui" font-size="8" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="16" fill="#e2e8f0" font-family="monospace" font-size="8">user_02</text>
        <text x="42" y="35" fill="#22c55e" font-family="monospace" font-size="7" text-anchor="middle">ACTIVE</text>
      </g>
      
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="8" fill="#64748b"/>
        <text x="18" y="20" fill="#fff" font-family="system-ui" font-size="7" text-anchor="middle">○</text>
        <text x="50" y="16" fill="#e2e8f0" font-family="monospace" font-size="8">user_03</text>
        <text x="42" y="35" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">AVAILABLE</text>
      </g>
      
      <!-- Row 2 -->
      <g transform="translate(0, 55)">
        <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="8" fill="#f59e0b"/>
        <text x="18" y="20" fill="#fff" font-family="system-ui" font-size="8" font-weight="bold" text-anchor="middle">◷</text>
        <text x="50" y="16" fill="#e2e8f0" font-family="monospace" font-size="8">user_04</text>
        <text x="42" y="35" fill="#f59e0b" font-family="monospace" font-size="7" text-anchor="middle">RESERVED</text>
      </g>
      
      <g transform="translate(95, 55)">
        <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="8" fill="#64748b"/>
        <text x="18" y="20" fill="#fff" font-family="system-ui" font-size="7" text-anchor="middle">○</text>
        <text x="50" y="16" fill="#e2e8f0" font-family="monospace" font-size="8">user_05</text>
        <text x="42" y="35" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">AVAILABLE</text>
      </g>
      
      <g transform="translate(190, 55)">
        <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="18" cy="16" r="8" fill="#64748b"/>
        <text x="18" y="20" fill="#fff" font-family="system-ui" font-size="7" text-anchor="middle">○</text>
        <text x="50" y="16" fill="#e2e8f0" font-family="monospace" font-size="8">user_06</text>
        <text x="42" y="35" fill="#94a3b8" font-family="monospace" font-size="7" text-anchor="middle">AVAILABLE</text>
      </g>
    </g>
    
    <!-- Stats bar -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="270" height="35" rx="6" fill="#0f172a"/>
      <g transform="translate(15, 10)">
        <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="7">Active</text>
        <text x="0" y="16" fill="#22c55e" font-family="system-ui" font-size="12" font-weight="bold">2</text>
      </g>
      <g transform="translate(70, 10)">
        <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="7">Reserved</text>
        <text x="0" y="16" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="bold">1</text>
      </g>
      <g transform="translate(140, 10)">
        <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="7">Available</text>
        <text x="0" y="16" fill="#64748b" font-family="system-ui" font-size="12" font-weight="bold">3</text>
      </g>
      <g transform="translate(210, 10)">
        <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="7">Total</text>
        <text x="0" y="16" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">118</text>
      </g>
    </g>
    
    <!-- Feature badges - CENTERED -->
    <g transform="translate(0, 225)">
      <rect x="35" y="0" width="50" height="22" rx="4" fill="url(#accentGrad)"/>
      <text x="60" y="15" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">API</text>
      
      <rect x="95" y="0" width="70" height="22" rx="4" fill="#475569"/>
      <text x="130" y="15" fill="#e2e8f0" font-family="monospace" font-size="8" text-anchor="middle">🔐 Keeper</text>
      
      <rect x="175" y="0" width="90" height="22" rx="4" fill="#475569"/>
      <text x="220" y="15" fill="#e2e8f0" font-family="monospace" font-size="8" text-anchor="middle">📋 Audit Trail</text>
    </g>
  </g>
  
  <!-- RIGHT SIDE: Consumers - FIXED SPACING -->
  <g transform="translate(580, 60)">
    <!-- Manual Testers Box -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="170" height="100" rx="8" fill="#1e293b" stroke="url(#orangeGrad)" stroke-width="2"/>
      <text x="85" y="22" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">👨‍💻 MANUAL TESTERS</text>
      
      <text x="15" y="45" fill="#94a3b8" font-family="system-ui" font-size="9">• Browse via Dashboard</text>
      <text x="15" y="60" fill="#94a3b8" font-family="system-ui" font-size="9">• Request accounts</text>
      <text x="15" y="75" fill="#94a3b8" font-family="system-ui" font-size="9">• View "My Accounts"</text>
      <text x="15" y="90" fill="#94a3b8" font-family="system-ui" font-size="9">• Quick Actions</text>
    </g>
    
    <!-- Automation Box - MORE SPACING FROM ABOVE -->
    <g transform="translate(0, 130)" filter="url(#shadow)">
      <rect x="0" y="0" width="170" height="100" rx="8" fill="#1e293b" stroke="url(#purpleGrad)" stroke-width="2"/>
      <text x="85" y="22" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">🤖 AUTOMATION</text>
      
      <text x="15" y="45" fill="#94a3b8" font-family="system-ui" font-size="9">• REST API integration</text>
      <text x="15" y="60" fill="#94a3b8" font-family="system-ui" font-size="9">• Auto allocation</text>
      <text x="15" y="75" fill="#94a3b8" font-family="system-ui" font-size="9">• Test teardown release</text>
      <text x="15" y="90" fill="#94a3b8" font-family="system-ui" font-size="9">• API tokens</text>
    </g>
  </g>
  
  <!-- Connection lines from dashboard to consumers -->
  <g stroke="url(#greenGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M550 140 Q565 110 580 110"/>
    <path d="M550 200 Q565 235 580 235"/>
  </g>
  
  <!-- Animated data flow dots -->
  <circle r="4" fill="#f59e0b" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M550 140 Q565 110 580 110"/>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M550 200 Q565 235 580 235"/>
  </circle>
  
  <!-- Time savings callout -->
  <g transform="translate(600, 305)">
    <rect x="0" y="0" width="140" height="55" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="70" y="20" fill="#22c55e" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">⏱️ TIME SAVED</text>
    <text x="70" y="42" fill="#fff" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">30-60 min/day</text>
  </g>
  
  <!-- Labels -->
  <text x="85" y="420" fill="#ef4444" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle" opacity="0.7">BEFORE</text>
  <text x="400" y="420" fill="#0ea5e9" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Centralized Management</text>
  <text x="665" y="420" fill="#22c55e" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle" opacity="0.7">CONSUMERS</text>
</svg>
